name: Beacon Biosignals
description: 'Beacon Biosignals develops AI-powered neurotechnology for brain health, applying
  machine learning to EEG (electroencephalography) data at scale. Its platform serves two markets:
  precision neuroscience for drug development, where it collects and analyzes EEG across the clinical
  trial lifecycle (2M+ hours of EEG analyzed across 40+ trials), and home sleep testing diagnostics
  through the SleepView Monitor and SleepView Direct products (500K+ home sleep tests completed).
  Beacon is also a prolific open-source contributor in the Julia ecosystem, publishing signal-data
  and modeling libraries such as Onda.jl, Legolas.jl, EDF.jl, Effects.jl, and Lighthouse.jl. This
  API Evangelist profile tracks the company as a life-sciences / neurotech provider; Beacon does not
  publish a public developer API, so this profile centers on its open-source software surface and
  company identity.'
